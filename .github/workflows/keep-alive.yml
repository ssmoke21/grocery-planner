name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 9 * * 1,4" # Every Monday and Thursday at 9am UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wsbbyegvzoflphzylzpn.supabase.co/rest/v1/app_state?id=eq.1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYmJ5ZWd2em9mbHBoenlsenBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDU0MjMsImV4cCI6MjA5MDMyMTQyM30.MTVBGIZZdxotiqRtBRMTNgzFaAqGUeOENfDOIuphBkY" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYmJ5ZWd2em9mbHBoenlsenBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDU0MjMsImV4cCI6MjA5MDMyMTQyM30.MTVBGIZZdxotiqRtBRMTNgzFaAqGUeOENfDOIuphBkY")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status code: $STATUS"
            exit 1
          fi
